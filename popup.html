<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wayback Bulk Save</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Wayback Bulk Save</h1>
    <p id="signin" class="note"></p>

    <label for="list" class="sr-only">Addresses, one per line</label>
    <textarea id="list" spellcheck="false" placeholder="https://&#10;One address per line"></textarea>
    <button type="button" id="start">SAVE PAGES</button>
    <p id="summary" role="status"></p>

    <div id="options">
      <label><input type="checkbox" name="capture_outlinks" /> Save outlinks</label>
      <label><input type="checkbox" name="capture_all" /> Save error pages (HTTP Status=4xx, 5xx)</label>
      <label><input type="checkbox" name="capture_screenshot" /> Save screenshot</label>
      <label><input type="checkbox" name="disable_adblocker" /> Disable ad blocker</label>
      <label><input type="checkbox" name="wm-save-mywebarchive" /> Save also in my web archive</label>
      <label><input type="checkbox" name="email_result" /> Email me the results (one email per address)</label>
      <label><input type="checkbox" name="wacz" /> Email me a WACZ file with the results</label>
      <label>Skip if saved within <input type="text" id="within" size="4" placeholder="1d" /></label>
      <label>Wait between saves <input type="number" id="delay" min="5" step="1" /> seconds</label>
    </div>

    <div id="more">
      <button type="button" id="retry" hidden>Retry Errors</button>
      <button type="button" id="clear" hidden>Clear Done</button>
    </div>
    <ol id="items"></ol>

    <script src="popup.js"></script>
  </body>
</html>
